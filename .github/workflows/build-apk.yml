name: Build Noor Salah Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noor-release.jks"

      - name: Build signed Release APK
        uses: gradle/gradle-build-action@v3
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/noor-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          gradle-version: 8.9
          arguments: testDebugUnitTest assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Salah-Release
          path: app/build/outputs/apk/release/*.apk
