plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv("KEYSTORE_FILE")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")
def stableDebugStoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")

def qvpAndroidAar = file("$projectDir/libs/qvp-android-0.8.0.aar")
def qvpAndroidAarUrl = "https://github.com/quran-ws/quran-engine/releases/download/v0.8.0/qvp-android-0.8.0.aar"
def qvpAndroidAarSha256 = "df3055762a6ffcfb8ba02626f607a87933d56f9b483f3be5783daa3d5352bc81"

tasks.register("downloadVerifiedQvpAndroidAar") {
    outputs.file(qvpAndroidAar)
    outputs.upToDateWhen { false }
    doLast {
        qvpAndroidAar.parentFile.mkdirs()
        if (!qvpAndroidAar.exists()) {
            def connection = new URL(qvpAndroidAarUrl).openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 120000
            connection.setRequestProperty("User-Agent", "NoorSalah-Android-Build")
            connection.inputStream.withCloseable { input ->
                qvpAndroidAar.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(qvpAndroidAar.bytes)
        def actualSha256 = new BigInteger(1, digest).toString(16).padLeft(64, "0")
        if (actualSha256 != qvpAndroidAarSha256) {
            qvpAndroidAar.delete()
            throw new GradleException("QVP Android renderer checksum mismatch; refusing to use an unverified native library.")
        }
    }
}

def adhanFullAsset = file("$projectDir/src/main/res/raw/adhan_full.ogg")
def adhanShortAsset = file("$projectDir/src/main/res/raw/adhan_short.ogg")
def adhanAudioSources = [
    [file: adhanFullAsset, url: "https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg",
     sha1: "a1fa4fd942401922c5c3301816384aae86956522", sha256: "35fe06b08fe80505c550c33fed8a783fa9901ddc81ac884958b4be048f5b2a79", size: 1229032],
    [file: adhanShortAsset, url: "https://upload.wikimedia.org/wikipedia/commons/e/e7/Adhan.ogg",
     sha1: "b86432f1581e11f898de1dc3402af0d541af110e", sha256: "faeb03e4338554fb8b54dba98ed4949648615b58e991bbd560a89f4837dde413", size: 338741]
]

tasks.register("downloadVerifiedAdhanAudio") {
    outputs.files(adhanFullAsset, adhanShortAsset)
    outputs.upToDateWhen { false }
    doLast {
        adhanAudioSources.each { source ->
            source.file.parentFile.mkdirs()
            if (!source.file.exists()) {
                def connection = new URL(source.url).openConnection()
                connection.connectTimeout = 20000
                connection.readTimeout = 60000
                connection.setRequestProperty("User-Agent", "NoorSalah-Android-Build")
                connection.inputStream.withCloseable { input ->
                    source.file.withOutputStream { output -> output << input }
                }
            }
            def digest = java.security.MessageDigest.getInstance("SHA-1").digest(source.file.bytes)
            def actualSha1 = new BigInteger(1, digest).toString(16).padLeft(40, "0")
            def actualSha256 = new BigInteger(1, java.security.MessageDigest.getInstance("SHA-256").digest(source.file.bytes))
                .toString(16).padLeft(64, "0")
            if (source.file.length() != source.size || actualSha1 != source.sha1 || actualSha256 != source.sha256) {
                source.file.delete()
                throw new GradleException("Adhan audio verification failed for ${source.file.name}.")
            }
        }
    }
}


android {
    namespace 'com.noorsalah.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noorsalah.app'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2'
        manifestPlaceholders = [appLabel: "نور الصلاة - NOOR"]
    }

    signingConfigs {
        debugPreview {
            storeFile stableDebugStoreFile
            storeType "JKS"
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile releaseStoreFile ? file(releaseStoreFile) : null
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            if (stableDebugStoreFile.exists()) {
                signingConfig signingConfigs.debugPreview
            } else {
                signingConfig signingConfigs.debug
            }
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            manifestPlaceholders = [appLabel: "نور الصلاة - معاينة"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            manifestPlaceholders = [appLabel: "نور الصلاة - NOOR"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation files(qvpAndroidAar)
    testImplementation 'junit:junit:4.13.2'
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("downloadVerifiedQvpAndroidAar"))
    dependsOn(tasks.named("downloadVerifiedAdhanAudio"))
}
