plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv("KEYSTORE_FILE")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")
def stableDebugStoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")

def qvpAndroidAar = file("$projectDir/libs/qvp-android-0.8.0.aar")
def qvpAndroidAarUrl = "https://github.com/quran-ws/quran-engine/releases/download/v0.8.0/qvp-android-0.8.0.aar"
def qvpAndroidAarSha256 = "df3055762a6ffcfb8ba02626f607a87933d56f9b483f3be5783daa3d5352bc81"

tasks.register("downloadVerifiedQvpAndroidAar") {
    outputs.file(qvpAndroidAar)
    outputs.upToDateWhen { false }
    doLast {
        qvpAndroidAar.parentFile.mkdirs()
        if (!qvpAndroidAar.exists()) {
            def connection = new URL(qvpAndroidAarUrl).openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 120000
            connection.setRequestProperty("User-Agent", "NoorSalah-Android-Build")
            connection.inputStream.withCloseable { input ->
                qvpAndroidAar.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(qvpAndroidAar.bytes)
        def actualSha256 = new BigInteger(1, digest).toString(16).padLeft(64, "0")
        if (actualSha256 != qvpAndroidAarSha256) {
            qvpAndroidAar.delete()
            throw new GradleException("QVP Android renderer checksum mismatch; refusing to use an unverified native library.")
        }
    }
}


def qpcHafsAsset = file("$projectDir/src/main/assets/qpc-hafs.json")
def qpcHafsGitBlobSha = "d924fc96f7a0f798d7cab319db2eefce1de37929"

tasks.register("verifyQpcHafsCorpus") {
    inputs.file(qpcHafsAsset)
    doLast {
        byte[] bytes = qpcHafsAsset.bytes
        byte[] header = "blob ${bytes.length}\u0000".getBytes("UTF-8")
        byte[] gitBlob = new byte[header.length + bytes.length]
        System.arraycopy(header, 0, gitBlob, 0, header.length)
        System.arraycopy(bytes, 0, gitBlob, header.length, bytes.length)
        String actual = java.security.MessageDigest.getInstance("SHA-1").digest(gitBlob)
            .collect { String.format("%02x", it & 0xff) }.join()
        if (actual != qpcHafsGitBlobSha) {
            throw new GradleException("QPC-Hafs Quran text checksum mismatch; refusing to package an unverified asset.")
        }

        def corpus = new groovy.json.JsonSlurper().parse(qpcHafsAsset)
        def metadata = new groovy.json.JsonSlurper().parse(file("$projectDir/src/main/assets/quran-surah-index.json"))
        if (corpus.keySet().size() != 114 || metadata.suras.size() != 114) {
            throw new GradleException("QPC-Hafs must contain all 114 surahs.")
        }
        int totalAyahs = 0
        (1..114).each { number ->
            def verses = corpus[number.toString()]
            def expectedCount = metadata.suras[number - 1].ayahs
            if (verses == null || verses.size() != expectedCount) {
                throw new GradleException("QPC-Hafs ayah count mismatch in surah ${number}.")
            }
            verses.eachWithIndex { verse, index ->
                if (verse.chapter != number || verse.verse != index + 1 || !verse.text?.trim()) {
                    throw new GradleException("QPC-Hafs verse sequence validation failed at ${number}:${index + 1}.")
                }
            }
            totalAyahs += verses.size()
        }
        if (totalAyahs != 6236) {
            throw new GradleException("QPC-Hafs Quran text failed full-corpus validation.")
        }
    }
}

android {
    namespace 'com.noorsalah.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noorsalah.app'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2'
        manifestPlaceholders = [appLabel: "نور الصلاة - NOOR"]
    }

    signingConfigs {
        debugPreview {
            storeFile stableDebugStoreFile
            storeType "JKS"
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile releaseStoreFile ? file(releaseStoreFile) : null
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            if (stableDebugStoreFile.exists()) {
                signingConfig signingConfigs.debugPreview
            } else {
                signingConfig signingConfigs.debug
            }
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            manifestPlaceholders = [appLabel: "نور الصلاة - معاينة"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            manifestPlaceholders = [appLabel: "نور الصلاة - NOOR"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation files(qvpAndroidAar)
    testImplementation 'junit:junit:4.13.2'
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("downloadVerifiedQvpAndroidAar"))
    dependsOn(tasks.named("verifyQpcHafsCorpus"))
}
