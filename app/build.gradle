plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv("KEYSTORE_FILE")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")
def stableDebugStoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")

def qvpAndroidAar = file("$projectDir/libs/qvp-android-0.8.0.aar")
def qvpAndroidAarUrl = "https://github.com/quran-ws/quran-engine/releases/download/v0.8.0/qvp-android-0.8.0.aar"
def qvpAndroidAarSha256 = "df3055762a6ffcfb8ba02626f607a87933d56f9b483f3be5783daa3d5352bc81"

def generatedAdhanResources = file("$buildDir/generated/adhan-res")
def adhanDownloadDir = file("$buildDir/adhan-downloads")
// Last-resort source: a previously CI-published APK containing the same licensed, checksum-verified recordings.
def adhanFallbackApkUrl = "https://github.com/zn2a3m-ui/noor-salah/releases/download/preview-474/app-debug.apk"
def adhanFallbackApkSha256 = "a2a8fee5126673a7859b9bb4cd3028c9aedb1f38f649853a3f5bc6c493d1ed67"
def adhanSources = [
    [
        name: "adhan_madinah",
        filename: "madinah.ogg",
        url: "https://upload.wikimedia.org/wikipedia/commons/7/7c/33937_ejaz215_call-to-prayer-from-the-prophet-s-mo.ogg",
        sha1: "4aa432b9e44804e7d72af4429bd743aa5fa9e3a4",
        fallbackSha256: "c1d0b9e7ce2271aa43469b27b55ab1a79cc7f0f9d2e3d246168cf22a2ab77a35"
    ],
    [
        name: "adhan_malmo_fajr",
        filename: "malmo-fajr.webm",
        url: "https://upload.wikimedia.org/wikipedia/commons/b/b1/Eid_al-Fitr_Fajr_azan_at_Malm%C3%B6_Mosque_-_19_August_2012.webm",
        sha1: "bc75d5cee271efb67f03d3f35474a9362fce103f",
        fallbackSha256: "4bd4f8af46ea76ac96bb5fc2f90cb84e18d070b09c81a5cfc3d07a528925be45"
    ]
]
def adhanOutputFiles = adhanSources.collect { new File(new File(generatedAdhanResources, "raw"), "${it.name}.mp3") }

tasks.register("prepareBundledAdhanAssets") {
    outputs.dir(generatedAdhanResources)
    outputs.upToDateWhen { adhanOutputFiles.every { it.isFile() && it.length() > 100_000 } }
    doLast {
        def ffmpegCheck = new ProcessBuilder("ffmpeg", "-version").redirectErrorStream(true).start()
        if (ffmpegCheck.waitFor() != 0) {
            throw new GradleException("FFmpeg is required to prepare the bundled adhan recordings. Install FFmpeg and retry.")
        }

        def rawDir = new File(generatedAdhanResources, "raw")
        rawDir.mkdirs()
        adhanDownloadDir.mkdirs()

        File fallbackApk = new File(adhanDownloadDir, "verified-adhan-fallback.apk")
        adhanSources.each { source ->
            File downloaded = new File(adhanDownloadDir, source.filename)
            boolean downloadedOk = false
            Exception lastError = null
            // Keep CI bounded: retry transient source-host/network failures briefly, then
            // switch to the checksum-pinned APK fallback instead of waiting several minutes.
            for (int attempt = 1; attempt <= 3 && !downloadedOk; attempt++) {
                java.net.HttpURLConnection connection = null
                try {
                    connection = (java.net.HttpURLConnection) new URL(source.url).openConnection()
                    connection.connectTimeout = 15000
                    connection.readTimeout = 60000
                    connection.setRequestProperty("User-Agent", "NoorSalah-Android-Build/1.0 (open-source app; contact: github.com/zn2a3m-ui/noor-salah)")
                    connection.setRequestProperty("Accept", "audio/ogg, audio/webm, application/octet-stream;q=0.9, */*;q=0.5")
                    int status = connection.responseCode
                    if (status == 429 || status >= 500) {
                        String retryAfter = connection.getHeaderField("Retry-After")
                        long waitMs = retryAfter?.isInteger()
                            ? Math.min(120000L, retryAfter.toLong() * 1000L)
                            : Math.min(120000L, 10000L * (1L << (attempt - 1)))
                        throw new java.io.IOException("Temporary HTTP " + status + " from licensed audio host; retrying after " + waitMs + "ms")
                    }
                    if (status < 200 || status >= 300) {
                        throw new java.io.IOException("Licensed audio host returned HTTP " + status)
                    }
                    connection.inputStream.withCloseable { input ->
                        downloaded.withOutputStream { output -> output << input }
                    }
                    downloadedOk = downloaded.isFile() && downloaded.length() > 100_000
                    if (!downloadedOk) throw new java.io.IOException("Downloaded audio file is incomplete or unexpectedly small")
                } catch (Exception error) {
                    lastError = error
                    downloaded.delete()
                    String message = error.message ?: error.toString()
                    boolean transientFailure = message.contains("HTTP 429") ||
                        message.contains("HTTP 5") ||
                        error instanceof java.net.SocketTimeoutException ||
                        error instanceof java.net.ConnectException ||
                        error instanceof java.net.UnknownHostException
                    if (attempt < 3 && transientFailure) {
                        long backoffMs = Math.min(30000L, 5000L * (1L << (attempt - 1)))
                        logger.lifecycle("Temporary adhan source failure for ${source.name} (attempt ${attempt}/3): ${message}. Retrying in ${backoffMs}ms.")
                        Thread.sleep(backoffMs)
                    } else {
                        logger.lifecycle("Stopping source retries for ${source.name}; will try the checksum-pinned fallback: ${message}")
                        break
                    }
                } finally {
                    connection?.disconnect()
                }
            }
            File output = new File(rawDir, "${source.name}.mp3")
            boolean usedVerifiedFallback = false
            if (!downloadedOk) {
                // Wikimedia can rate-limit CI runners (HTTP 429). Recover the exact same
                // licensed recordings from a prior signed-by-CI preview APK, pinning both
                // the APK and each extracted MP3 by SHA-256 before packaging.
                if (!fallbackApk.isFile()) {
                    java.net.HttpURLConnection fallbackConnection = null
                    try {
                        fallbackConnection = (java.net.HttpURLConnection) new URL(adhanFallbackApkUrl).openConnection()
                        fallbackConnection.connectTimeout = 15000
                        fallbackConnection.readTimeout = 90000
                        fallbackConnection.setRequestProperty("User-Agent", "NoorSalah-Android-Build/1.0")
                        if (fallbackConnection.responseCode != 200) {
                            throw new java.io.IOException("Fallback preview APK returned HTTP " + fallbackConnection.responseCode)
                        }
                        fallbackConnection.inputStream.withCloseable { input ->
                            fallbackApk.withOutputStream { target -> target << input }
                        }
                    } finally {
                        fallbackConnection?.disconnect()
                    }
                    String apkSha256 = java.security.MessageDigest.getInstance("SHA-256").digest(fallbackApk.bytes)
                        .collect { String.format("%02x", it & 0xff) }.join()
                    if (apkSha256 != adhanFallbackApkSha256) {
                        fallbackApk.delete()
                        throw new GradleException("Fallback preview APK checksum mismatch; refusing unverified adhan assets.")
                    }
                }

                def extract = new ProcessBuilder("unzip", "-p", fallbackApk.absolutePath, "res/raw/${source.name}.mp3")
                    .redirectOutput(output).redirectErrorStream(true).start()
                String extractLog = extract.inputStream.getText("UTF-8")
                if (extract.waitFor() != 0 || !output.isFile() || output.length() < 100_000) {
                    output.delete()
                    throw new GradleException("Could not extract verified fallback audio for ${source.name}: ${extractLog}; original download error: ${lastError}")
                }
                String fallbackAudioSha256 = java.security.MessageDigest.getInstance("SHA-256").digest(output.bytes)
                    .collect { String.format("%02x", it & 0xff) }.join()
                if (fallbackAudioSha256 != source.fallbackSha256) {
                    output.delete()
                    throw new GradleException("Fallback audio checksum mismatch for ${source.name}; refusing unverified recording.")
                }
                usedVerifiedFallback = true
                logger.lifecycle("Using checksum-verified bundled adhan fallback for ${source.name} after source download was rate-limited.")
            }

            if (!usedVerifiedFallback) {
                if (source.sha1) {
                    String actualSha1 = java.security.MessageDigest.getInstance("SHA-1").digest(downloaded.bytes)
                        .collect { String.format("%02x", it & 0xff) }.join()
                    if (actualSha1 != source.sha1) {
                        downloaded.delete()
                        throw new GradleException("Checksum mismatch for ${source.filename}; refusing to package an unverified recording.")
                    }
                }

                def transcode = new ProcessBuilder(
                    "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
                    "-i", downloaded.absolutePath, "-map", "0:a:0", "-vn",
                    "-ac", "1", "-ar", "44100", "-b:a", "128k", output.absolutePath
                ).redirectErrorStream(true).start()
                String ffmpegLog = transcode.inputStream.getText("UTF-8")
                if (transcode.waitFor() != 0 || !output.isFile() || output.length() < 100_000) {
                    output.delete()
                    throw new GradleException("Audio conversion failed for ${source.filename}: ${ffmpegLog}")
                }
            }
        }
    }
}

tasks.register("downloadVerifiedQvpAndroidAar") {
    outputs.file(qvpAndroidAar)
    outputs.upToDateWhen { false }
    doLast {
        qvpAndroidAar.parentFile.mkdirs()
        if (!qvpAndroidAar.exists()) {
            def connection = new URL(qvpAndroidAarUrl).openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 120000
            connection.setRequestProperty("User-Agent", "NoorSalah-Android-Build")
            connection.inputStream.withCloseable { input ->
                qvpAndroidAar.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(qvpAndroidAar.bytes)
        def actualSha256 = new BigInteger(1, digest).toString(16).padLeft(64, "0")
        if (actualSha256 != qvpAndroidAarSha256) {
            qvpAndroidAar.delete()
            throw new GradleException("QVP Android renderer checksum mismatch; refusing to use an unverified native library.")
        }
    }
}


def qpcHafsAsset = file("$projectDir/src/main/assets/qpc-hafs.json")
def qpcHafsGitBlobSha = "d924fc96f7a0f798d7cab319db2eefce1de37929"

tasks.register("verifyQpcHafsCorpus") {
    inputs.file(qpcHafsAsset)
    doLast {
        byte[] bytes = qpcHafsAsset.bytes
        byte[] header = "blob ${bytes.length}\u0000".getBytes("UTF-8")
        byte[] gitBlob = new byte[header.length + bytes.length]
        System.arraycopy(header, 0, gitBlob, 0, header.length)
        System.arraycopy(bytes, 0, gitBlob, header.length, bytes.length)
        String actual = java.security.MessageDigest.getInstance("SHA-1").digest(gitBlob)
            .collect { String.format("%02x", it & 0xff) }.join()
        if (actual != qpcHafsGitBlobSha) {
            throw new GradleException("QPC-Hafs Quran text checksum mismatch; refusing to package an unverified asset.")
        }

        def corpus = new groovy.json.JsonSlurper().parse(qpcHafsAsset)
        def metadata = new groovy.json.JsonSlurper().parse(file("$projectDir/src/main/assets/quran-surah-index.json"))
        if (corpus.keySet().size() != 114 || metadata.suras.size() != 114) {
            throw new GradleException("QPC-Hafs must contain all 114 surahs.")
        }
        int totalAyahs = 0
        (1..114).each { number ->
            def verses = corpus[number.toString()]
            def expectedCount = metadata.suras[number - 1].ayahs
            if (verses == null || verses.size() != expectedCount) {
                throw new GradleException("QPC-Hafs ayah count mismatch in surah ${number}.")
            }
            verses.eachWithIndex { verse, index ->
                if (verse.chapter != number || verse.verse != index + 1 || !verse.text?.trim()) {
                    throw new GradleException("QPC-Hafs verse sequence validation failed at ${number}:${index + 1}.")
                }
            }
            totalAyahs += verses.size()
        }
        if (totalAyahs != 6236) {
            throw new GradleException("QPC-Hafs Quran text failed full-corpus validation.")
        }
    }
}

android {
    sourceSets.main.res.srcDir(generatedAdhanResources)
    namespace 'com.noorsalah.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noorsalah.app'
        minSdk 24
        targetSdk 36
        versionCode (project.findProperty('versionCode')?.toString()?.toInteger() ?: 4)
        versionName (project.findProperty('versionName')?.toString() ?: '1.2')
        manifestPlaceholders = [appLabel: "نور الصلاة - NOOR"]
    }

    signingConfigs {
        debugPreview {
            storeFile stableDebugStoreFile
            storeType "JKS"
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile releaseStoreFile ? file(releaseStoreFile) : null
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            if (stableDebugStoreFile.exists()) {
                signingConfig signingConfigs.debugPreview
            } else {
                signingConfig signingConfigs.debug
            }
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            manifestPlaceholders = [appLabel: "نور الصلاة - معاينة"]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            manifestPlaceholders = [appLabel: "نور الصلاة - NOOR"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation files(qvpAndroidAar)
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("downloadVerifiedQvpAndroidAar"))
    dependsOn(tasks.named("verifyQpcHafsCorpus"))
    dependsOn(tasks.named("prepareBundledAdhanAssets"))
}
