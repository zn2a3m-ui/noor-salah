plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv("KEYSTORE_FILE")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")

def tanzilQuranAsset = file("$projectDir/src/main/assets/tanzil-uthmani-1.1.txt")
def tanzilQuranUrl = "https://raw.githubusercontent.com/iptvchecker/content-tanzil/1f7f2e368983e33208f16bbb7fbf826fc0a56619/tanzil-uthmani-1.1.txt"
def tanzilQuranSha256 = "ac0724796cbbda0f4801470fbbd11d0f3c5802067bae0493466d0128b0c667af"

tasks.register("downloadVerifiedTanzilQuran") {
    outputs.file(tanzilQuranAsset)
    outputs.upToDateWhen { false }
    doLast {
        tanzilQuranAsset.parentFile.mkdirs()
        if (!tanzilQuranAsset.exists()) {
            def connection = new URL(tanzilQuranUrl).openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 60000
            connection.setRequestProperty("User-Agent", "NoorSalah-Android-Build")
            connection.inputStream.withCloseable { input ->
                tanzilQuranAsset.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(tanzilQuranAsset.bytes)
        def actualSha256 = new BigInteger(1, digest).toString(16).padLeft(64, "0")
        if (actualSha256 != tanzilQuranSha256) {
            tanzilQuranAsset.delete()
            throw new GradleException("Tanzil Quran asset checksum mismatch; refusing to package unverified text.")
        }
        def ayahLineCount = tanzilQuranAsset.readLines("UTF-8").count { line ->
            !line.trim().isEmpty() && !line.startsWith("#")
        }
        if (ayahLineCount != 6236) {
            throw new GradleException("Tanzil Quran text must contain 6,236 verse lines; found ${ayahLineCount}.")
        }
        def quranMetadataFile = file("$projectDir/src/main/assets/quran-surah-index.json")
        def quranMetadata = new groovy.json.JsonSlurper().parse(quranMetadataFile)
        def totalAyahs = quranMetadata.suras.collect { it.ayahs }.sum()
        if (quranMetadata.suras.size() != 114 || totalAyahs != 6236 ||
            quranMetadata.juz.size() != 30 || quranMetadata.hizbQuarters.size() != 240 ||
            quranMetadata.manzils.size() != 7 || quranMetadata.rukus.size() != 556 ||
            quranMetadata.pages.size() != 604 || quranMetadata.sajdas.size() != 15) {
            throw new GradleException("Tanzil Quran metadata failed structural validation.")
        }
        def expectedStartLine = 0
        quranMetadata.suras.eachWithIndex { surah, index ->
            if (surah.number != index + 1 || surah.start != expectedStartLine) {
                throw new GradleException("Tanzil surah boundaries are not contiguous.")
            }
            expectedStartLine += surah.ayahs
        }
    }
}


android {
    namespace 'com.noorsalah.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noorsalah.app'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile releaseStoreFile ? file(releaseStoreFile) : null
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("downloadVerifiedTanzilQuran"))
}
